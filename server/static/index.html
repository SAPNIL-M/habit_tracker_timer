<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stopwatch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='40' fill='none' stroke='%234c8dff' stroke-width='8'/%3E%3Crect x='46' y='22' width='8' height='26' rx='4' fill='%234c8dff'/%3E%3Crect x='50' y='52' width='22' height='7' rx='3.5' fill='%234c8dff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div id="app">
    <header>
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Connecting…</span>
    </header>

    <main>
      <div id="time">00:00:00</div>
      <div id="hoursHint">0.00 h</div>

      <div class="controls">
        <button id="toggleBtn" disabled>Start</button>
        <button id="resetBtn" disabled>Reset</button>
      </div>

      <p id="gateMsg" class="hidden"></p>
      <p id="gateNote" class="hidden">This profile isn't signed in to Chrome, so the stopwatch is locked by extension presence instead of your email. For the strictest check, sign into Chrome in this profile.</p>
      <p id="footnote">Counts only while your personal Chrome profile is in use.</p>
    </main>
  </div>

  <script src="static/app.js"></script>
</body>
</html>
